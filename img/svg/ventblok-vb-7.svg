<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Схема габаритов: ВБ-7, 210×210×180 мм">
  <style>
    .bg   { fill: #F0F3F6; }
    .face { fill: #FFFFFF; stroke: #6B7278; stroke-width: 1.6; stroke-linejoin: round; }
    .face--top  { fill: #E7EBEF; }
    .face--side { fill: #DDE2E7; }
    .ext  { stroke: #9AA1A8; stroke-width: 1; }
    .ttl  { fill: #23262A; font: 500 27px/1 Georgia, 'Times New Roman', serif; }
    .lbl  { fill: #6B7278; font: 400 13px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            letter-spacing: .09em; text-transform: uppercase; }
    .dim  { fill: #4A4F55; font: 400 15px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #101213; }
      .face { fill: #202326; stroke: #6B7278; }
      .face--top  { fill: #282C30; }
      .face--side { fill: #191C1E; }
      .ttl  { fill: #EDEFF1; }
      .lbl  { fill: #9AA1A8; }
      .dim  { fill: #C3C8CD; }
      .ext  { stroke: #6B7278; }
    }
  </style>
  <rect class="bg" width="800" height="600"/>
  <text class="lbl" x="56" y="52">Схема габаритов · размеры в мм</text>
  <text class="ttl" x="56" y="88">ВБ-7</text>
  <polygon class="face face--top" points="247.3,212.8 450.9,212.8 552.7,127.2 349.1,127.2"/>
  <polygon class="face face--side" points="450.9,387.2 552.7,301.7 552.7,127.2 450.9,212.8"/>
  <polygon class="face" points="247.3,387.2 450.9,387.2 450.9,212.8 247.3,212.8"/>
  <text class="dim" x="349.1" y="417.2" text-anchor="middle">210</text>
  <text class="dim" x="233.3" y="305.0" text-anchor="end">180</text>
  <text class="dim" x="564.7" y="170.0" text-anchor="start">210</text>
  <line class="ext" x1="247.3" y1="395.2" x2="247.3" y2="409.2"/>
  <line class="ext" x1="450.9" y1="395.2" x2="450.9" y2="409.2"/>
  <line class="ext" x1="247.3" y1="402.2" x2="450.9" y2="402.2"/>
  <text class="lbl" x="56" y="556">малый · чертёж по размерам прайса</text>
</svg>
