<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Схема габаритов: ВБ-8, 430×210×180 мм">
  <style>
    .bg   { fill: #F0F3F6; }
    .face { fill: #FFFFFF; stroke: #6B7278; stroke-width: 1.6; stroke-linejoin: round; }
    .face--top  { fill: #E7EBEF; }
    .face--side { fill: #DDE2E7; }
    .ext  { stroke: #9AA1A8; stroke-width: 1; }
    .ttl  { fill: #23262A; font: 500 27px/1 Georgia, 'Times New Roman', serif; }
    .lbl  { fill: #6B7278; font: 400 13px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            letter-spacing: .09em; text-transform: uppercase; }
    .dim  { fill: #4A4F55; font: 400 15px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #101213; }
      .face { fill: #202326; stroke: #6B7278; }
      .face--top  { fill: #282C30; }
      .face--side { fill: #191C1E; }
      .ttl  { fill: #EDEFF1; }
      .lbl  { fill: #9AA1A8; }
      .dim  { fill: #C3C8CD; }
      .ext  { stroke: #6B7278; }
    }
  </style>
  <rect class="bg" width="800" height="600"/>
  <text class="lbl" x="56" y="52">Схема габаритов · размеры в мм</text>
  <text class="ttl" x="56" y="88">ВБ-8</text>
  <polygon class="face face--top" points="190.0,229.3 527.6,229.3 610.0,160.1 272.4,160.1"/>
  <polygon class="face face--side" points="527.6,370.7 610.0,301.4 610.0,160.1 527.6,229.3"/>
  <polygon class="face" points="190.0,370.7 527.6,370.7 527.6,229.3 190.0,229.3"/>
  <text class="dim" x="358.8" y="400.7" text-anchor="middle">430</text>
  <text class="dim" x="176.0" y="305.0" text-anchor="end">180</text>
  <text class="dim" x="622.0" y="194.7" text-anchor="start">210</text>
  <line class="ext" x1="190.0" y1="378.7" x2="190.0" y2="392.7"/>
  <line class="ext" x1="527.6" y1="378.7" x2="527.6" y2="392.7"/>
  <line class="ext" x1="190.0" y1="385.7" x2="527.6" y2="385.7"/>
  <text class="lbl" x="56" y="556">с перемычкой · чертёж по размерам прайса</text>
</svg>
